# Erzeugt aus scripts/staging/repositories.json; gemeinsame Prüfeinstiege bleiben maßgeblich.
name: Staging CI
'on':
  push:
    branches:
    - staging
  pull_request: {}
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: staging-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: Tests und Build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      dependencies: ${{ steps.dependencies.outputs.commits }}
      root: ${{ steps.dependencies.outputs.root }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: morta5/phoneDispatchIntegration
        ref: staging
        ssh-key: ${{ secrets.CI_READ_INTEGRATION_KEY }}
        path: mono
        submodules: false
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        path: mono/geo-software/adressSuche
        submodules: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.13'
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '22'
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      with:
        distribution: temurin
        java-version: '21'
    - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
      with:
        go-version: 1.27.2
    - name: Vollständige Repository-Prüfung
      working-directory: mono/geo-software/adressSuche
      run: python -m pip install -r requirements.txt pytest pytest-asyncio && scripts/test.sh --full
      env:
        E2E_LIVE_TRUNK: '0'
        TEST_ALLOW_NATIVE: '1'
    - name: Geprüfte Abhängigkeitsstände festhalten
      id: dependencies
      env:
        DEPENDENCY_PATHS: '{}'
      run: "python3 - <<'PYDEPS'\nimport json, os, subprocess\npaths = json.loads(os.environ['DEPENDENCY_PATHS'])\ncommits\
        \ = {repo: subprocess.check_output(['git', '-C', path, 'rev-parse', 'HEAD'], text=True).strip() for repo, path in\
        \ paths.items()}\nroot = subprocess.check_output(['git', '-C', 'mono', 'rev-parse', 'HEAD'], text=True).strip()\n\
        with open(os.environ['GITHUB_OUTPUT'], 'a') as output:\n    output.write('commits=' + json.dumps(commits) + '\\n')\n\
        \    output.write('root=' + root + '\\n')\nPYDEPS"
  image:
    name: Image prüfen und veröffentlichen
    needs: checks
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: morta5/phoneDispatchIntegration
        ref: ${{ needs.checks.outputs.root }}
        ssh-key: ${{ secrets.CI_READ_INTEGRATION_KEY }}
        path: mono
        submodules: false
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        path: mono/geo-software/adressSuche
        submodules: false
    - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
    - name: Geprüftes Image bauen
      id: build
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
      with:
        context: mono/geo-software/adressSuche
        load: true
        tags: ghcr.io/morta5/adresssuche:sha-${{ github.sha }}
        cache-from: type=gha,scope=staging
        cache-to: type=gha,mode=max,scope=staging
        file: mono/geo-software/adressSuche/Dockerfile.staging
    - name: Fertige Laufzeit prüfen
      working-directory: mono/geo-software/adressSuche
      run: python3 scripts/image-smoke.py --image ghcr.io/morta5/adresssuche:sha-${{ github.sha }}
    - name: HIGH/CRITICAL blockieren
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
      with:
        image-ref: ghcr.io/morta5/adresssuche:sha-${{ github.sha }}
        severity: HIGH,CRITICAL
        exit-code: '1'
        format: table
    - name: GHCR-Anmeldung
      env:
        GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: printf "%s" "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
    - name: Image veröffentlichen
      id: publish
      env:
        IMAGE: ghcr.io/morta5/adresssuche:sha-${{ github.sha }}
      run: 'docker push "$IMAGE"

        digest=$(docker inspect "$IMAGE" --format "{{index .RepoDigests 0}}")

        printf "image=%s\n" "$digest" >> "$GITHUB_OUTPUT"'
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: morta5/phoneDispatchIntegration
        ref: staging
        ssh-key: ${{ secrets.STAGING_PROMOTION_SSH_KEY }}
        path: promotion
        persist-credentials: true
    - name: Geprüften Kandidaten melden
      working-directory: promotion
      env:
        STAGING_COMPONENT: addresses
        STAGING_IMAGE: ${{ steps.publish.outputs.image }}
        STAGING_SOURCE_REPOSITORY: ${{ github.repository }}
        STAGING_SOURCE_SHA: ${{ github.sha }}
        STAGING_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        STAGING_DEPENDENCIES: ${{ needs.checks.outputs.dependencies }}
        STAGING_SOURCE_DIR: ${{ github.workspace }}/mono/geo-software/adressSuche
      run: python3 scripts/staging/report-candidate.py
